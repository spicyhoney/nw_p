name: PostgreSQL CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgresql-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: home_repair_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_repair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/home_repair_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,data,dev]"

      - name: Check affected Python files
        run: |
          python -m ruff check \
            src/home_repair_agent/backend/case_ports.py \
            src/home_repair_agent/backend/case_services.py \
            src/home_repair_agent/backend/postgres_case_repository.py \
            src/home_repair_agent/data_cleaning/postgres.py \
            src/home_repair_agent/web/app.py \
            src/home_repair_agent/web/demo_case_repository.py \
            src/home_repair_agent/web/models.py \
            src/home_repair_agent/web/service.py \
            tests/test_consumer_accessibility.py \
            tests/test_postgres_case_repository.py \
            tests/test_postgres_integration.py \
            tests/test_web_app.py
          python -m ruff format --check \
            src/home_repair_agent/backend/case_ports.py \
            src/home_repair_agent/backend/case_services.py \
            src/home_repair_agent/backend/postgres_case_repository.py \
            src/home_repair_agent/data_cleaning/postgres.py \
            src/home_repair_agent/web/app.py \
            src/home_repair_agent/web/demo_case_repository.py \
            src/home_repair_agent/web/models.py \
            src/home_repair_agent/web/service.py \
            tests/test_consumer_accessibility.py \
            tests/test_postgres_case_repository.py \
            tests/test_postgres_integration.py \
            tests/test_web_app.py

      - name: Compile Python modules
        run: python -m compileall -q src tests

      - name: Run full test suite with PostgreSQL
        run: python -m pytest -q
