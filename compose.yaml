services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: home_repair
      POSTGRES_USER: home_repair
      POSTGRES_PASSWORD: home_repair
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_repair -d home_repair"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
