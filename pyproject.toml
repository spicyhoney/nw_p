[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-repair-agent"
version = "1.0.1"
description = "Auditable AI-assisted home-repair consultation and provider dispatch platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "spicyhoney" },
]
keywords = ["repair-captain-ai", "agent", "fastapi", "mcp", "postgresql", "bedrock", "agentcore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2,<3",
]

[project.urls]
Repository = "https://github.com/spicyhoney/repair-captain-ai"
Documentation = "https://github.com/spicyhoney/repair-captain-ai#readme"

[project.optional-dependencies]
data = [
    "pandas>=2,<3",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2,<3",
]
app = [
    "boto3",
    "fastapi",
    "huggingface_hub>=1.24,<2",
    "httpx>=0.27,<1",
    "mcp>=1.27,<2",
    "Pillow>=10,<13",
    "python-multipart>=0.0.20,<1",
    "uvicorn",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
home-repair-clean = "home_repair_agent.data_cleaning.cli:main"
home-repair-fetch-reference = "home_repair_agent.data_cleaning.reference_cli:main"
home-repair-mcp = "home_repair_agent.mcp_server.server:main"
home-repair-agent-demo = "home_repair_agent.agent.demo:main"
home-repair-web = "home_repair_agent.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_repair_agent = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
