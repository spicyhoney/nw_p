[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-repair-agent"
version = "0.1.0"
description = "Home repair consultation and service matching agent for the 2026 Taiwan GenAI Hackathon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
data = [
    "pandas>=2,<3",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2,<3",
]
app = [
    "boto3",
    "fastapi",
    "mcp>=1.27,<2",
    "uvicorn",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
home-repair-clean = "home_repair_agent.data_cleaning.cli:main"
home-repair-fetch-reference = "home_repair_agent.data_cleaning.reference_cli:main"
home-repair-mcp = "home_repair_agent.mcp_server.server:main"
home-repair-agent-demo = "home_repair_agent.agent.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
